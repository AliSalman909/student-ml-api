name: CI

# Runs on every pull request targeting main. This workflow validates changes
# only: it never publishes an image to the registry. Publishing is handled
# exclusively by release.yml, which is triggered by a version tag.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (validation only, not pushed)
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.value }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            -t student-ml-api:ci-${{ github.sha }} \
            .

      - name: Start container
        run: |
          docker run -d --name student-ml-api-ci \
            -p 5000:5000 \
            student-ml-api:ci-${{ github.sha }}

      - name: Verify health endpoint responds
        run: |
          for attempt in $(seq 1 10); do
            if curl -fs http://localhost:5000/health; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            echo "Waiting for container to become ready ($attempt/10)..."
            sleep 2
          done
          echo "Container failed to become healthy. Logs:"
          docker logs student-ml-api-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f student-ml-api-ci || true
